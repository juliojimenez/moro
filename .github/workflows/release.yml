name: Release

# Pushing a tag such as v0.1.0 builds the .vsix, attaches it to a GitHub
# release and, when the VSCE_PAT / OVSX_PAT secrets exist, publishes it to the
# Visual Studio Marketplace and Open VSX. The tag must match package.json.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Check, build and test
        run: |
          npm run check
          npm run build
          npm test

      - name: Package
        run: npx @vscode/vsce package --out "moro-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "moro-${{ steps.version.outputs.version }}.vsix" \
            --title "moro ${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath "moro-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "moro-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
